name: Historical growth criteria backtest

on:
  workflow_dispatch:
    inputs:
      filing_review:
        description: Download selected original public filings for case review
        type: boolean
        default: false
      years:
        description: JSON list of cohort years
        type: string
        default: '[2016,2019,2021]'
      shards:
        description: JSON list of shard numbers
        type: string
        default: '[0,1,2,3,4,5]'

permissions:
  contents: read
  actions: read

jobs:
  cohort:
    if: ${{ !inputs.filing_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        year: ${{ fromJSON(inputs.years) }}
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      COHORT_YEAR: ${{ matrix.year }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed historical cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$COHORT_YEAR" =~ ^(2016|2019|2021)$ && "$SHARD" =~ ^[0-5]$ ]]
          gh run download 45557103694 --name "historical-growth-$COHORT_YEAR" --dir source
      - name: Collect prior filing for the repeated-growth study
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -Bu scripts/collect_repeated_growth.py "source/cohort-$COHORT_YEAR.json" --shard "$SHARD" --output "historical/repeat-$COHORT_YEAR-$SHARD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: repeated-growth-${{ matrix.year }}-${{ matrix.shard }}
          path: historical/repeat-${{ matrix.year }}-${{ matrix.shard }}.json
          if-no-files-found: error

  filings:
    if: ${{ inputs.filing_review }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download the original OpenDART filing documents
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -Bu scripts/collect_growth_case_filings.py original-filings
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: original-growth-case-filings
          path: original-filings/
          if-no-files-found: error
