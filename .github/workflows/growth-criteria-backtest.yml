name: Historical growth criteria backtest

on:
  workflow_dispatch:
    inputs:
      retry_2019_1_only:
        description: Retry only 2019 shard 1
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: ${{ fromJSON(inputs.retry_2019_1_only && '[2019]' || '[2016,2019,2021]') }}
        shard: ${{ fromJSON(inputs.retry_2019_1_only && '[1]' || '[0,1,2,3]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed historical cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45557103694 --name historical-growth-${{ matrix.year }} --dir source
      - name: Collect point-in-time EPS and operating cash flow
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python3 -Bu scripts/collect_growth_quality.py source/cohort-${{ matrix.year }}.json --shard ${{ matrix.shard }} --output historical/quality-${{ matrix.year }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: historical-quality-${{ matrix.year }}-${{ matrix.shard }}
          path: historical/quality-${{ matrix.year }}-${{ matrix.shard }}.json
          if-no-files-found: error
