name: Growth stock tracking

on:
  schedule:
    - cron: "37 10 * * 1-5"
    - cron: "52 10 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "Update scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - daily
          - weekly

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve update scope
        id: scope
        shell: bash
        run: |
          SCOPE="${{ github.event.inputs.scope || 'all' }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "37 10 * * 1-5" ]; then SCOPE="daily"; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "52 10 * * 1" ]; then SCOPE="weekly"; fi
          echo "scope=$SCOPE" >> "$GITHUB_OUTPUT"

      - name: Update 5-stock daily tracking
        if: steps.scope.outputs.scope == 'all' || steps.scope.outputs.scope == 'daily'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/update-daily-tracking.js

      - name: Apply 5-stock daily tracking
        if: steps.scope.outputs.scope == 'all' || steps.scope.outputs.scope == 'daily'
        run: node scripts/apply-daily-tracking.js index.html data/daily-growth-tracking.json

      - name: Update 20-stock weekly watchlist
        if: steps.scope.outputs.scope == 'all' || steps.scope.outputs.scope == 'weekly'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/update-weekly-watchlist.js

      - name: Apply 20-stock weekly watchlist
        if: steps.scope.outputs.scope == 'all' || steps.scope.outputs.scope == 'weekly'
        run: node scripts/apply-weekly-watchlist.js index.html data/weekly-growth-watchlist.json

      - name: Update 20-stock DART financial snapshots
        if: steps.scope.outputs.scope == 'all' || steps.scope.outputs.scope == 'weekly'
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/update-financial-snapshots.js

      - name: Apply DART financial snapshots
        run: node scripts/apply-financial-snapshots.js

      - name: Apply company decision model
        run: node scripts/apply-company-decision-model.js

      - name: Validate dashboard
        run: node scripts/check-dashboard.js index.html

      - name: Commit updated dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update growth stock tracking"
          file_pattern: "index.html data/*.json"

